name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: 'dist'
      - name: Collect generated SVGs
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/snake-out"
          find "${{ github.workspace }}" -name '*.svg' -type f -exec cp {} "${{ github.workspace }}/snake-out/" \;
          echo "--- workspace ---"; ls -la "${{ github.workspace }}"
          echo "--- collected ---"; ls -la "${{ github.workspace }}/snake-out"
      - name: Commit snake to output branch
        run: |
          set -e
          cd "${{ github.workspace }}/snake-out"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/${{ github.repository }}.git" HEAD:output
